[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcgs-full-chain-studio"
version = "0.1.0"
description = "Local-first MCGS engineering assembly and protocol generation assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "MCGS Full-Chain Studio contributors" },
]
dependencies = [
  "fastapi==0.124.4",
  "uvicorn==0.38.0",
  "pydantic==2.12.5",
  "jinja2==3.1.6",
  "openpyxl==3.1.2",
]

[project.urls]
Homepage = "https://github.com/Feianxc/mcgs-full-chain-studio"
Issues = "https://github.com/Feianxc/mcgs-full-chain-studio/issues"

[tool.setuptools.packages.find]
include = ["protocol_studio*", "mvp_generator*"]
