name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.production.txt
            requirements.dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.dev.txt
          python -m pip check

      - name: Validate source and structured files
        run: python scripts/validate_repository.py

      - name: Scan public tree
        run: python scripts/check_public_tree.py --root .

      - name: Run Python and JavaScript regression tests
        run: python scripts/run_tests.py

      - name: Validate allowlist release plan
        env:
          SOURCE_DATE_EPOCH: "0"
        run: python packaging/build_release.py --version 0.0.0-ci --check-only
