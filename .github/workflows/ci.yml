name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.production.txt
            requirements.dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.dev.txt
          python -m pip check

      - name: Validate source and structured files
        run: python scripts/validate_repository.py

      - name: Scan public tree
        run: python scripts/check_public_tree.py --root .

      - name: Run Python and JavaScript regression tests
        run: python scripts/run_tests.py

      - name: Validate allowlist release plan
        env:
          SOURCE_DATE_EPOCH: "0"
        run: python packaging/build_release.py --version 0.0.0-ci --check-only
