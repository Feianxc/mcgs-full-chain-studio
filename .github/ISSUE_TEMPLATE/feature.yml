name: Feature request
description: Propose a generic workflow or generator improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: Describe the generic problem without customer or employer data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Proposed verification
      description: Separate automated checks from MCGS compile, simulation and site acceptance.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This proposal contains no customer, credential, proprietary MCGS or production material.
          required: true
